# ============================================================================
# Card POR CLIENTE para o dashboard do HA CENTRAL (Bubble Card).
# Duas peças, na MESMA view. Duplique o par por cliente, trocando:
#   - o entity  (sensor.feedback_<cliente>)
#   - o hash    (#<cliente>)
#   - o name
#
# Descubra o entity_id real em Configurações > Dispositivos > "Feedback <cliente>".
# ============================================================================


# ── PEÇA 1: TILE (mostra o total; toca e abre o popup) ──────────────────────
type: custom:bubble-card
card_type: button
button_type: name
entity: sensor.feedback_marzzano
name: marzzano
icon: mdi:message-alert
show_state: true
tap_action:
  action: navigate
  navigation_path: "#marzzano"
sub_button:
  - name: Última
    entity: sensor.feedback_marzzano
    attribute: ultima_categoria
    show_attribute: true
    show_background: false


