# ============================================================================
# Card do CENTRAL (esquerda): visão geral — 1 linha por cliente, pior no topo.
# Auto-descobre os clientes varrendo sensor.feedback_*_monitoring.
#
# Fonte: atributo 'estado' (Entity Monitor >= 0.9.0), que o cliente reenvia a
# cada 30 min e após cada queda/recuperação. O central SUBSTITUI o estado
# inteiro a cada envio, então os números são sempre atuais. Janelas CORRIDAS:
# "24h" = últimas 24 horas, "7d" = últimos 7 dias, a partir do último envio.
#
# Níveis (nessa ordem no card):
#   ⚫ sem contato   — nenhum estado recebido há mais de SEM_CONTATO_H horas
#                     (HA ou internet do cliente fora do ar)
#   🔴 caída agora   — alguma entidade está unavailable neste momento
#   🟠 queda 24h     — houve queda nas últimas 24h (já recuperada)
#   🟡 queda 7d      — houve queda nos últimos 7 dias (nada nas últimas 24h)
#   ⚪ aguardando    — cliente ainda sem Entity Monitor 0.9.0
#   🟢 OK
#
# 1 queda = 1 entidade unavailable por >= 30s. Flickers ficam no card de
# detalhe (direita).
#
# Central em português → troque '_monitoring' por '_monitoramento'.
# ============================================================================

type: markdown
content: >
  {% macro dur(segundos) %}{% set t = segundos | int(0) %}{{ (t ~ 's') if t < 60 else ((t // 60) ~ 'm') if t < 3600 else (((t // 60 + 29) // 60) ~ 'h') if t < 172800 else ((t // 86400) ~ 'd') }}{% endmacro %}
  {% set SEM_CONTATO_H = 1 %}
  {% set now_ts = as_timestamp(now()) %}
  {% set ns = namespace(itens=[], problema=0, total=0) %}
  {% for s in states.sensor
       if s.entity_id.startswith('sensor.feedback_')
       and s.entity_id.endswith('_monitoring') %}
  {% set ns.total = ns.total + 1 %}
  {% set cliente = s.attributes.get('cliente', s.entity_id) %}
  {% set nome = '**' ~ (cliente[0] | upper) ~ cliente[1:] ~ '**' %}
  {% set est = s.attributes.get('estado') %}
  {% set idade = now_ts - as_timestamp(s.attributes.get('sincronizado_em'), 0) %}
  {% set a = 0 %}{% set b = 0 %}
  {% if not est %}
  {% set nivel = 4 %}
  {% set linha = '⚪ ' ~ nome ~ ' · aguardando Entity Monitor 0.9' %}
  {% elif idade > SEM_CONTATO_H * 3600 %}
  {% set nivel = 0 %}
  {% set linha = '⚫ ' ~ nome ~ ' · sem contato há ' ~ dur(idade) %}
  {% else %}
  {% set its = est.integracoes or [] %}
  {% set pior = its[0] if its else none %}
  {% set nomeint = (' · ' ~ pior.integracao) if pior else '' %}
  {% if est.caidas_agora | int > 0 %}
  {% set nivel = 1 %}
  {% set a = est.caidas_agora | int %}{% set b = est.dia.outages | int %}
  {% set longa = namespace(ts=now_ts, nome='') %}
  {% for it in its %}{% for e in it.entidades if e.caida_agora %}
  {% set ts = as_timestamp(e.caida_desde, now_ts) %}
  {% if ts < longa.ts %}{% set longa.ts = ts %}{% set longa.nome = e.nome %}{% endif %}
  {% endfor %}{% endfor %}
  {% set linha = '🔴 ' ~ nome ~ ' · ' ~ a ~ (' caídas' if a > 1 else ' caída') ~ ' agora' ~ nomeint
       ~ ((' · ⏱️ ' ~ longa.nome ~ ' há ' ~ dur(now_ts - longa.ts)) if longa.nome else '') %}
  {% elif est.dia.outages | int > 0 %}
  {% set nivel = 2 %}
  {% set a = est.dia.outages | int %}{% set b = est.dia.outage_downtime | int %}
  {% set top = (pior.entidades[0] if pior and pior.entidades else none) %}
  {% set linha = '🟠 ' ~ nome ~ ' · ' ~ a ~ (' quedas' if a > 1 else ' queda') ~ ' 24h (' ~ est.dia.outage_downtime_fmt ~ ')' ~ nomeint
       ~ ((' · ⏱️ ' ~ top.nome ~ ' (' ~ top.dia.outage_downtime_fmt ~ ')') if top and top.dia.outages | int > 0 else '') %}
  {% elif est.semana.outages | int > 0 %}
  {% set nivel = 3 %}
  {% set a = est.semana.outages | int %}{% set b = est.semana.outage_downtime | int %}
  {% set linha = '🟡 ' ~ nome ~ ' · ' ~ a ~ (' quedas' if a > 1 else ' queda') ~ ' 7d (' ~ est.semana.outage_downtime_fmt ~ ')' ~ nomeint %}
  {% else %}
  {% set nivel = 5 %}
  {% set linha = '🟢 ' ~ nome ~ ' · OK' %}
  {% endif %}
  {% endif %}
  {% if nivel <= 3 %}{% set ns.problema = ns.problema + 1 %}{% endif %}
  {% set ordem = '%d_%06d_%09d_%s' | format(nivel, 999999 - a, 999999999 - b, cliente) %}
  {% set ns.itens = ns.itens + [{'ordem': ordem, 'linha': linha}] %}
  {% endfor %}
  {% set corpo = ns.itens | sort(attribute='ordem') | map(attribute='linha') | join('\n- ') %}
  {{ '# 🖥️ Monitoramento · ' ~ (ns.total - ns.problema) ~ '/' ~ ns.total ~ ' OK'
     ~ ('  ·  ⚠️ ' ~ ns.problema ~ ' com problema' if ns.problema else '')
     ~ ('\n\n- ' ~ corpo if corpo else '\n\nNenhum cliente cadastrado.') }}
