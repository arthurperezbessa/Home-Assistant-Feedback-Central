# ============================================================================
# VIEW de monitoramento para MUITOS clientes (~20). Automático (novos entram).
# Estratégia: priorizar. Quem tem problema recente vai pro TOPO; quem está OK
# fica embaixo, em uma linha só. Detalhe fica num 2º card, só dos com alerta.
#
# "Recente" = último alerta nas últimas 24h (ajuste JANELA_H abaixo).
# Cor por kind: 🟡 n1 · 🟠 n2 · 🔴 n3 · 🔵 snapshot · 🟢 OK
#
# OBS: entity_id em inglês (_monitoring). Central em português → _monitoramento.
# ============================================================================


# ── CARD 1 (principal): visão geral — 1 linha por cliente, pior no topo ──────
type: markdown
content: >
  {% set peso = {'n3': 4, 'n2': 3, 'n1': 2, 'snapshot': 1} %}
  {% set cor = {'n3': '🔴', 'n2': '🟠', 'n1': '🟡', 'snapshot': '🔵'} %}
  {% set JANELA_H = 24 %}
  {% set now_ts = as_timestamp(now()) %}
  {% set ns = namespace(itens=[], alerta=0, total=0) %}
  {% for s in states.sensor
       if s.entity_id.startswith('sensor.feedback_')
       and s.entity_id.endswith('_monitoring') %}
  {% set ns.total = ns.total + 1 %}
  {% set cliente = s.attributes.get('cliente', s.entity_id) %}
  {% set kind = s.attributes.get('ultimo_kind') %}
  {% set ets = as_timestamp(s.attributes.get('ultimo_em'), 0) %}
  {% set recente = ets > 0 and (now_ts - ets) < JANELA_H * 3600 and kind in peso %}
  {% set w = peso.get(kind, 0) if recente else 0 %}
  {% if recente %}{% set ns.alerta = ns.alerta + 1 %}{% endif %}
  {% set dot = cor.get(kind, '⚪') if recente else '🟢' %}
  {% set desc = (s.attributes.get('ultima_integracao', '') ~ ' — '
       ~ s.attributes.get('ultima_mensagem', '')) if recente else 'sem alertas recentes' %}
  {% set linha = dot ~ ' **' ~ cliente ~ '** · ' ~ desc %}
  {% set ns.itens = ns.itens + [{'ordem': (9 - w) ~ '_' ~ cliente, 'linha': linha}] %}
  {% endfor %}
  {% set corpo = ns.itens | sort(attribute='ordem') | map(attribute='linha') | join('\n- ') %}
  {{ '# 🖥️ Monitoramento · ' ~ (ns.total - ns.alerta) ~ '/' ~ ns.total ~ ' OK'
     ~ ('  ·  ⚠️ ' ~ ns.alerta ~ ' com alerta' if ns.alerta else '') ~ '\n\n- ' ~ corpo }}


