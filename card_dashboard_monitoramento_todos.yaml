# ============================================================================
# VIEW de monitoramento para MUITOS clientes (~20). Automático (novos entram).
# Estratégia: priorizar. Quem tem problema recente vai pro TOPO; quem está OK
# fica embaixo, em uma linha só. Detalhe fica no card da direita (por integração).
#
# IMPORTANTE — consistência com o card de janelas (direita):
#   A cor E os números desta esquerda vêm da MESMA fonte da direita:
#   'janelas_por_integracao', considerando integrações com queda real na SEMANA
#   (semana.outages > 0). É EXATAMENTE o mesmo filtro do card da direita, então
#   os mesmos clientes/integrações aparecem nos dois (ex.: Ramiro igual nos dois).
#   Mostra a semana inteira — sem filtro de "frescor" de 24h.
#
# Linha de um cliente com alerta (única linha):
#   🔴 Cliente · Integração · N quedas ontem (tempo) · X ent. · ⏱️ Entidade (tempo)
# Cliente sem queda fresca: 🟢 Cliente · OK
# Cor da bolinha: severidade do último alerta (🟡 n1 · 🟠 n2 · 🔴 n3) se fresca;
# senão 🔴 por padrão (pois há queda fresca). Sem queda → 🟢.
#
# OBS: entity_id em inglês (_monitoring). Central em português → _monitoramento.
# ============================================================================


# ── CARD 1 (principal): visão geral — 1 linha por cliente, pior no topo ──────
type: markdown
content: >
  {% set cor = {'n3': '🔴', 'n2': '🟠', 'n1': '🟡', 'snapshot': '🔵'} %}
  {% set JANELA_H = 24 %}
  {% set now_ts = as_timestamp(now()) %}
  {% set ns = namespace(itens=[], alerta=0, total=0) %}
  {% for s in states.sensor
       if s.entity_id.startswith('sensor.feedback_')
       and s.entity_id.endswith('_monitoring') %}
  {% set ns.total = ns.total + 1 %}
  {% set cliente = s.attributes.get('cliente', s.entity_id) %}
  {% set kind = s.attributes.get('ultimo_kind') %}
  {% set ets = as_timestamp(s.attributes.get('ultimo_em'), 0) %}
  {% set kind_fresh = ets > 0 and (now_ts - ets) < JANELA_H * 3600 and kind in cor %}
  {% set js = s.attributes.get('janelas_por_integracao') or [] %}
  {% set worst = namespace(sem=0, dia=0, nome='', diafmt='', semfmt='', ent=0, top=[]) %}
  {% for it in js %}
  {% if (it.janela.semana.outages | int) > 0 %}
  {% if (it.janela.semana.outages | int) > worst.sem %}
  {% set worst.sem = it.janela.semana.outages | int %}
  {% set worst.dia = it.janela.dia.outages | int %}
  {% set worst.nome = it.integracao %}
  {% set worst.diafmt = it.janela.dia.outage_downtime_fmt %}
  {% set worst.semfmt = it.janela.semana.outage_downtime_fmt %}
  {% set worst.ent = it.entidades_afetadas %}
  {% set worst.top = it.top or [] %}
  {% endif %}
  {% endif %}
  {% endfor %}
  {% set alerta = worst.sem > 0 %}
  {% if alerta %}{% set ns.alerta = ns.alerta + 1 %}{% endif %}
  {% set usar_dia = worst.dia > 0 %}
  {% set be = namespace(seg=-1, nome='', tempo='') %}
  {% for e in worst.top %}
  {% set seg = (e.windows.dia.outage_downtime | float) if usar_dia else (e.windows.semana.outage_downtime | float) %}
  {% if seg > be.seg %}
  {% set be.seg = seg %}
  {% set be.nome = e.name %}
  {% set be.tempo = e.windows.dia.outage_downtime_fmt if usar_dia else e.windows.semana.outage_downtime_fmt %}
  {% endif %}
  {% endfor %}
  {% set dot = cor.get(kind, '🔴') if (alerta and kind_fresh) else ('🔴' if alerta else '🟢') %}
  {% if alerta %}
  {% set q = worst.dia if usar_dia else worst.sem %}
  {% set qfmt = worst.diafmt if usar_dia else worst.semfmt %}
  {% set quando = 'ontem' if usar_dia else '7d' %}
  {% set desc = ((worst.nome[0] | upper) ~ worst.nome[1:])
       ~ ' · ' ~ q ~ ' quedas ' ~ quando ~ ' (' ~ qfmt ~ ')'
       ~ ' · ' ~ worst.ent ~ ' ent.'
       ~ (' · ⏱️ ' ~ be.nome ~ ' (' ~ be.tempo ~ ')' if be.nome else '') %}
  {% set rank = '%06d' | format(999999 - worst.sem) %}
  {% set ordem = '0_' ~ rank ~ '_' ~ cliente %}
  {% else %}
  {% set desc = 'OK' %}
  {% set ordem = '1_' ~ cliente %}
  {% endif %}
  {% set linha = dot ~ ' **' ~ (cliente[0] | upper) ~ cliente[1:] ~ '** · ' ~ desc %}
  {% set ns.itens = ns.itens + [{'ordem': ordem, 'linha': linha}] %}
  {% endfor %}
  {% set corpo = ns.itens | sort(attribute='ordem') | map(attribute='linha') | join('\n- ') %}
  {{ '# 🖥️ Monitoramento · ' ~ (ns.total - ns.alerta) ~ '/' ~ ns.total ~ ' OK'
     ~ ('  ·  ⚠️ ' ~ ns.alerta ~ ' com alerta' if ns.alerta else '') ~ '\n\n- ' ~ corpo }}


