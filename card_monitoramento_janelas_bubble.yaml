# ============================================================================
# Card do CENTRAL: quedas por período, AGRUPADAS POR INTEGRAÇÃO, de TODOS os
# clientes automaticamente. Varre os sensores sensor.feedback_*_monitoring —
# cliente novo cadastrado no central aparece sozinho, sem selecionar entidade.
#
# Escala quando muitas entidades caem juntas (hub offline = 50 entidades →
# "Integração — 50 entidades", com as 3 piores nomeadas + "(+47)").
#
# Preenche no N3 e no snapshot de boot. Central em português → _monitoramento.
# ============================================================================

type: markdown
content: >
  {% set o = namespace(v='# 🖥️ Monitoramento — quedas por integração\n') %}
  {% for m in states.sensor
       if m.entity_id.startswith('sensor.feedback_')
       and m.entity_id.endswith('_monitoring') %}
  {% set cliente = m.attributes.get('cliente', m.entity_id) %}
  {% set integs = m.attributes.get('janelas_por_integracao') or [] %}
  {% set o.v = o.v ~ '\n## ' ~ cliente %}
  {% if integs %}
  {% for it in integs %}
  {% set d = it.janela.dia %}
  {% set w = it.janela.semana %}
  {% set t = it.janela.total %}
  {% set o.v = o.v ~ '\n### ' ~ it.integracao ~ ' — ' ~ it.entidades_afetadas ~ ' entidades' %}
  {% set o.v = o.v ~ '\n- 🔴 quedas — ontem ' ~ d.outages ~ '× (' ~ d.outage_downtime_fmt
    ~ '), 7d ' ~ w.outages ~ '× (' ~ w.outage_downtime_fmt
    ~ '), total ' ~ t.outages ~ '× (' ~ t.outage_downtime_fmt ~ ')' %}
  {% set o.v = o.v ~ '\n- ⚡ flickers — ontem ' ~ d.flickers ~ ', 7d ' ~ w.flickers
    ~ ', total ' ~ t.flickers %}
  {% for e in it.top %}
  {% set o.v = o.v ~ '\n  • ' ~ e.name ~ ': ontem ' ~ e.windows.dia.outages
    ~ '× (' ~ e.windows.dia.outage_downtime_fmt ~ ')' %}
  {% endfor %}
  {% set resto = it.entidades_afetadas - (it.top | length) %}
  {% if resto > 0 %}
  {% set o.v = o.v ~ '\n  • (+' ~ resto ~ ' entidades)' %}
  {% endif %}
  {% endfor %}
  {% else %}
  {% set o.v = o.v ~ '\n_Sem quedas registradas._' %}
  {% endif %}
  {% set o.v = o.v ~ '\n' %}
  {% endfor %}
  {{ o.v }}
