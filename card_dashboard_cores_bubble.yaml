# ============================================================================
# Card do CENTRAL com cor por tipo de report.
# Troque 'sensor.feedback_marzzano' pelo sensor do cliente desejado.
#
# Legenda de cores (categoria → cor):
#   🔴 Erros Gerais         🟣 Áudio e Vídeo      🟡 Iluminação
#   🔵 Ar Condicionado      🟤 Cortinas           🟢 Automações ou Cenas
#   🟠 Melhorias
# ============================================================================


# ── OPÇÃO A: LISTA COLORIDA (markdown) — funciona em qualquer HA ─────────────
# O markdown inteiro é montado numa ÚNICA expressão {{ }} com \n explícito,
# pra a dobra do YAML não grudar o título na primeira mensagem.
type: markdown
content: >
  {% set sensor = 'sensor.feedback_marzzano' %}
  {% set cores = {
    'Erros Gerais': '🔴', 'Áudio e Vídeo': '🟣', 'Iluminação': '🟡',
    'Ar Condicionado': '🔵', 'Cortinas': '🟤', 'Automações ou Cenas': '🟢',
    'Melhorias': '🟠'
  } %}
  {% set msgs = state_attr(sensor, 'ultimas_mensagens') or [] %}
  {% set l = namespace(v='') %}
  {% for m in msgs %}
  {% set l.v = l.v ~ '\n- ' ~ cores.get(m.categoria, '⚪') ~ ' **' ~ m.categoria
    ~ '** — ' ~ m.texto ~ ' <small>'
    ~ (as_timestamp(m.em) | timestamp_custom('%d/%m %H:%M'))
    ~ (' · ' ~ m.local if m.local else '') ~ '</small>' %}
  {% endfor %}
  {{ '### 📣 ' ~ state_attr(sensor, 'cliente') ~ ' · ' ~ states(sensor) ~ ' reports\n'
     ~ (l.v if msgs else '\n_Nenhuma mensagem ainda._') }}


