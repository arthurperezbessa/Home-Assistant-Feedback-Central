# ============================================================================
# CARDS INTELIGENTES — listam TODOS os clientes automaticamente.
# Não precisa selecionar entidade por cliente: os cards varrem os sensores
# pelo padrão do nome. Cliente novo cadastrado no central aparece sozinho.
#
# Sensores por cliente:
#   feedback     -> sensor.feedback_<cliente>
#   monitoramento -> sensor.feedback_<cliente>_monitoring   (central em inglês)
# Central em português: troque '_monitoring' por '_monitoramento' abaixo.
# ============================================================================


# ── CARD A: FEEDBACK de todos os clientes ────────────────────────────────────
type: markdown
content: >
  {% set cor = {'Erros Gerais':'🔴','Áudio e Vídeo':'🟣','Iluminação':'🟡',
    'Ar Condicionado':'🔵','Cortinas':'🟤','Automações ou Cenas':'🟢','Melhorias':'🟠'} %}
  {% set o = namespace(v='# 💬 Feedback dos clientes\n') %}
  {% for s in states.sensor
       if s.entity_id.startswith('sensor.feedback_')
       and not s.entity_id.endswith('_monitoring') %}
  {% set cliente = s.attributes.get('cliente', s.entity_id) %}
  {% set msgs = s.attributes.get('ultimas_mensagens') or [] %}
  {% set o.v = o.v ~ '\n### ' ~ cliente ~ ' · ' ~ s.state ~ ' reports\n' %}
  {% if msgs %}
  {% for m in msgs[:3] %}
  {% set o.v = o.v ~ '\n- ' ~ cor.get(m.categoria, '⚪') ~ ' **' ~ m.categoria
    ~ '** — ' ~ m.texto %}
  {% endfor %}
  {% set o.v = o.v ~ '\n' %}
  {% else %}
  {% set o.v = o.v ~ '\n_Sem mensagens._\n' %}
  {% endif %}
  {% endfor %}
  {{ o.v }}


